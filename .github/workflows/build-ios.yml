name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild iOS native project
        run: npx expo prebuild --platform ios --clean

      - name: Fix ExpoModulesJSI Swift package version
        run: |
          # Patch Package.swift inside node_modules/@expo/cli or expo-modules-core if present
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} + || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive
        run: |
          cd ios
          # Allow package resolution to proceed without strict version failures
          xcodebuild archive \
            -workspace Atlas.xcworkspace \
            -scheme Atlas \
            -configuration Release \
            -archivePath build/Atlas.xcarchive \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath ./SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Generate IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Atlas.xcarchive/Products/Applications/Atlas.app Payload/
          zip -qr Atlas.ipa Payload
          mkdir -p ../artifacts
          mv Atlas.ipa ../artifacts/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-iOS-IPA
          path: artifacts/Atlas.ipa
          retention-days: 7
