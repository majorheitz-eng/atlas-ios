name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods

      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --clean

      - name: Build iOS Archive (Unsigned / Generic)
        run: |
          cd ios
          pod install
          xcodebuild \
            -workspace Atlas.xcworkspace \
            -scheme Atlas \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Atlas.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package Payload into IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/Atlas.xcarchive/Products/Applications/Atlas.app Payload/
          zip -qr Atlas.ipa Payload
          mkdir -p ../artifacts
          mv Atlas.ipa ../artifacts/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-iOS-IPA
          path: artifacts/Atlas.ipa
          retention-days: 7
