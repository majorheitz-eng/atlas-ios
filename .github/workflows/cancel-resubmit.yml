name: Cancel Beta Review & Resubmit

on:
  workflow_dispatch:

jobs:
  cancel:
    name: Cancel build 1 review, submit build 2
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip3 install pyjwt requests cryptography

      - name: Cancel and resubmit
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4YS72UMN75
          ASC_ISSUER_ID: 98cc8215-df4b-4071-993d-2f83eb0e502d
        run: |
          echo "$ASC_KEY_P8" > AuthKey_4YS72UMN75.p8
          
          python3 << 'PYEOF'
          import jwt, time, requests, json

          key_id = "4YS72UMN75"
          issuer_id = "98cc8215-df4b-4071-993d-2f83eb0e502d"
          app_id = "6820563445"

          with open("AuthKey_4YS72UMN75.p8", "r") as f:
              private_key = f.read()

          payload = {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # Get beta review submissions
          print("=== Getting beta review submissions ===")
          submissions_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaAppReviewSubmissions"
          sub_resp = requests.get(submissions_url, headers=headers)
          sub_data = sub_resp.json()
          print(json.dumps(sub_data, indent=2)[:1000])

          # Cancel any existing review submissions
          if "data" in sub_data:
              for sub in sub_data["data"]:
                  sub_id = sub["id"]
                  state = sub["attributes"].get("betaReviewState", "?")
                  print(f"Submission {sub_id}: state={state}")
                  if state in ("WAITING_FOR_REVIEW", "IN_REVIEW"):
                      print(f"Cancelling submission {sub_id}...")
                      cancel_url = f"https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions/{sub_id}"
                      cancel_resp = requests.delete(cancel_url, headers=headers)
                      print(f"Cancel: {cancel_resp.status_code}")

          # Wait a moment
          time.sleep(2)

          # Now submit build 2
          print("\n=== Getting builds ===")
          builds_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/builds"
          builds_resp = requests.get(builds_url, headers=headers)
          builds_data = builds_resp.json()

          build2 = None
          for build in builds_data.get("data", []):
              v = build["attributes"].get("version", "?")
              s = build["attributes"].get("processingState", "?")
              e = build["attributes"].get("expired", False)
              print(f"Build {v}: state={s}, expired={e}")
              if v == "2" and s == "VALID" and not e:
                  build2 = build
                  break

          if not build2:
              print("Build 2 not found or not valid")
              exit(1)

          build_id = build2["id"]

          # Set export compliance
          print(f"\nSetting export compliance for build 2...")
          ec_url = f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}"
          ec_body = {"data": {"type": "builds", "id": build_id, "attributes": {"usesNonExemptEncryption": False}}}
          ec_resp = requests.patch(ec_url, headers=headers, json=ec_body)
          print(f"Export compliance: {ec_resp.status_code}")

          # Add build to beta group
          print("\nAdding build to beta group...")
          groups_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups"
          groups_resp = requests.get(groups_url, headers=headers)
          groups_data = groups_resp.json()
          if "data" in groups_data and len(groups_data["data"]) > 0:
              group_id = groups_data["data"][0]["id"]
              add_url = f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/relationships/builds"
              add_body = {"data": [{"type": "builds", "id": build_id}]}
              add_resp = requests.post(add_url, headers=headers, json=add_body)
              print(f"Add to group: {add_resp.status_code}")

          # Submit for beta review
          print(f"\nSubmitting build 2 for beta review...")
          review_url = "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions"
          review_body = {"data": {"type": "betaAppReviewSubmissions", "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}}
          review_resp = requests.post(review_url, headers=headers, json=review_body)
          print(f"Review submission: {review_resp.status_code}")
          print(json.dumps(review_resp.json(), indent=2)[:500])

          PYEOF
