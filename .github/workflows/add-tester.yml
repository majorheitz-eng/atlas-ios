name: Add Beta Tester

on:
  workflow_dispatch:

jobs:
  add-tester:
    name: Add Beta Tester
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip3 install pyjwt requests cryptography

      - name: Add tester and assign to group
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4YS72UMN75
          ASC_ISSUER_ID: 98cc8215-df4b-4071-993d-2f83eb0e502d
          APP_ID: 6818316186
        run: |
          echo "$ASC_KEY_P8" > AuthKey_4YS72UMN75.p8
          
          python3 << 'PYEOF'
          import jwt, time, requests, json

          key_id = "4YS72UMN75"
          issuer_id = "98cc8215-df4b-4071-993d-2f83eb0e502d"
          app_id = "6818316186"
          tester_email = "captainmajorh@gmail.com"
          tester_first = "Major"
          tester_last = "Heitz"

          with open("AuthKey_4YS72UMN75.p8", "r") as f:
              private_key = f.read()

          payload = {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # 1. Check if beta tester already exists
          print("=== Checking for existing beta testers ===")
          testers_url = f"https://api.appstoreconnect.apple.com/v1/betaTesters?filter[email]={tester_email}"
          testers_resp = requests.get(testers_url, headers=headers)
          testers_data = testers_resp.json()
          print(f"Status: {testers_resp.status_code}")

          tester_id = None
          if "data" in testers_data and len(testers_data["data"]) > 0:
              tester_id = testers_data["data"][0]["id"]
              print(f"Tester already exists: {tester_id}")
          else:
              # Create beta tester
              print("Creating beta tester...")
              create_url = "https://api.appstoreconnect.apple.com/v1/betaTesters"
              create_body = {
                  "data": {
                      "type": "betaTesters",
                      "attributes": {
                          "email": tester_email,
                          "firstName": tester_first,
                          "lastName": tester_last
                      },
                      "relationships": {
                          "apps": {
                              "data": [{"type": "apps", "id": app_id}]
                          }
                      }
                  }
              }
              create_resp = requests.post(create_url, headers=headers, json=create_body)
              print(f"Create status: {create_resp.status_code}")
              create_data = create_resp.json()
              print(json.dumps(create_data, indent=2)[:500])
              if "data" in create_data:
                  tester_id = create_data["data"]["id"]
              elif create_resp.status_code == 409:
                  # Already exists - find them
                  print("Tester may already exist, trying to find...")
                  all_testers_url = f"https://api.appstoreconnect.apple.com/v1/betaTesters?filter[email]={tester_email}"
                  recheck = requests.get(all_testers_url, headers=headers)
                  recheck_data = recheck.json()
                  if "data" in recheck_data and len(recheck_data["data"]) > 0:
                      tester_id = recheck_data["data"][0]["id"]

          if not tester_id:
              print("Could not create or find tester")
              exit(1)

          print(f"Tester ID: {tester_id}")

          # 2. Get beta group
          print("\n=== Getting beta group ===")
          groups_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups"
          groups_resp = requests.get(groups_url, headers=headers)
          groups_data = groups_resp.json()
          
          group_id = None
          if "data" in groups_data and len(groups_data["data"]) > 0:
              group_id = groups_data["data"][0]["id"]
              print(f"Group: {group_id}")

          # 3. Add tester to group
          if group_id and tester_id:
              print(f"\nAdding tester to group {group_id}...")
              add_url = f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/relationships/betaTesters"
              add_body = {"data": [{"type": "betaTesters", "id": tester_id}]}
              add_resp = requests.post(add_url, headers=headers, json=add_body)
              print(f"Add to group: {add_resp.status_code}")
              if add_resp.status_code not in (200, 201, 409):
                  print(json.dumps(add_resp.json(), indent=2)[:500])
              else:
                  print("Tester added to group successfully!")

          # 4. Also add build to group
          print("\n=== Getting builds ===")
          builds_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/builds"
          builds_resp = requests.get(builds_url, headers=headers)
          builds_data = builds_resp.json()
          
          for build in builds_data.get("data", []):
              v = build["attributes"].get("version", "?")
              s = build["attributes"].get("processingState", "?")
              e = build["attributes"].get("expired", False)
              if s == "VALID" and not e:
                  build_id = build["id"]
                  print(f"Adding build {v} to group...")
                  add_build_url = f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/relationships/builds"
                  add_build_body = {"data": [{"type": "builds", "id": build_id}]}
                  add_build_resp = requests.post(add_build_url, headers=headers, json=add_build_body)
                  print(f"  Build {v}: {add_build_resp.status_code}")
                  break  # Only add the first valid build

          print("\nDone! Tester should receive TestFlight invitation email.")

          PYEOF
