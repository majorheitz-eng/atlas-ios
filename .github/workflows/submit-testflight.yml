name: Submit Build to TestFlight

on:
  workflow_dispatch:

jobs:
  submit:
    name: Submit Build for TestFlight
    runs-on: macos-15
    steps:
      - name: Install dependencies
        run: pip3 install --break-system-packages pyjwt requests cryptography

      - name: Check builds and submit for beta testing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4YS72UMN75
          ASC_ISSUER_ID: 98cc8215-df4b-4071-993d-2f83eb0e502d
          APP_ID: 6818316186
        run: |
          echo "$ASC_KEY_P8" > AuthKey_4YS72UMN75.p8
          
          python3 << 'PYEOF'
          import jwt
          import time
          import requests
          import json

          key_id = "4YS72UMN75"
          issuer_id = "98cc8215-df4b-4071-993d-2f83eb0e502d"
          app_id = "6818316186"

          with open("AuthKey_4YS72UMN75.p8", "r") as f:
              private_key = f.read()

          payload = {
              "iss": issuer_id,
              "iat": int(time.time()),
              "exp": int(time.time()) + 1200,
              "aud": "appstoreconnect-v1"
          }

          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }

          # Get all builds for the app
          url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/builds"
          resp = requests.get(url, headers=headers)
          print(f"GET builds status: {resp.status_code}")
          data = resp.json()
          
          if "data" not in data:
              print("No builds found or auth error")
              print(json.dumps(data, indent=2))
              exit(1)
          
          valid_build = None
          for build in data["data"]:
              version = build["attributes"].get("version", "unknown")
              processing_state = build["attributes"].get("processingState", "unknown")
              expired = build["attributes"].get("expired", False)
              build_id = build["id"]
              print(f"Build {version}: state={processing_state}, expired={expired}, id={build_id}")
              
              if processing_state == "VALID" and not expired:
                  valid_build = build
                  break

          if not valid_build:
              print("No VALID non-expired build found. Builds may still be processing.")
              exit(0)

          build_id = valid_build["id"]
          build_version = valid_build["attributes"]["version"]
          print(f"\nSubmitting build {build_version} (id={build_id}) for beta review...")

          # Create betaAppReviewSubmission
          review_url = "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions"
          review_body = {
              "data": {
                  "type": "betaAppReviewSubmissions",
                  "relationships": {
                      "build": {
                          "data": {
                              "type": "builds",
                              "id": build_id
                          }
                      }
                  }
              }
          }
          review_resp = requests.post(review_url, headers=headers, json=review_body)
          print(f"Beta review submission status: {review_resp.status_code}")
          print(json.dumps(review_resp.json(), indent=2))

          if review_resp.status_code in (201, 200, 409):
              print("\nBuild submitted for TestFlight beta review!")
          else:
              print(f"\nSubmission may have failed. Check response above.")

          PYEOF
