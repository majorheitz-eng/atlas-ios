name: Submit Build to TestFlight

on:
  workflow_dispatch:

jobs:
  submit:
    name: Submit Build for TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip3 install pyjwt requests cryptography

      - name: Set beta info and submit build
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 4YS72UMN75
          ASC_ISSUER_ID: 98cc8215-df4b-4071-993d-2f83eb0e502d
          APP_ID: 6818316186
        run: |
          echo "$ASC_KEY_P8" > AuthKey_4YS72UMN75.p8
          
          python3 << 'PYEOF'
          import jwt, time, requests, json

          key_id = "4YS72UMN75"
          issuer_id = "98cc8215-df4b-4071-993d-2f83eb0e502d"
          app_id = "6820563445"  # Atlas RayNeo

          with open("AuthKey_4YS72UMN75.p8", "r") as f:
              private_key = f.read()

          payload = {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 1200, "aud": "appstoreconnect-v1"}
          token = jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          # 1. Set beta app localization (required for TestFlight)
          print("=== Setting beta app localization ===")
          loc_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaAppLocalizations"
          loc_resp = requests.get(loc_url, headers=headers)
          loc_data = loc_resp.json()
          
          if "data" in loc_data and len(loc_data["data"]) > 0:
              loc_id = loc_data["data"][0]["id"]
              print(f"Updating localization {loc_id}...")
              update_url = f"https://api.appstoreconnect.apple.com/v1/betaAppLocalizations/{loc_id}"
              update_body = {"data": {"type": "betaAppLocalizations", "id": loc_id, "attributes": {"description": "Atlas Voice Assistant - RayNeo glasses companion app", "feedbackEmail": "captainmajorh@gmail.com"}}}
              update_resp = requests.patch(update_url, headers=headers, json=update_body)
              print(f"Update: {update_resp.status_code}")
          else:
              print("Creating localization...")
              create_url = "https://api.appstoreconnect.apple.com/v1/betaAppLocalizations"
              create_body = {"data": {"type": "betaAppLocalizations", "attributes": {"description": "Atlas Voice Assistant - RayNeo glasses companion app", "feedbackEmail": "captainmajorh@gmail.com", "locale": "en-US"}, "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}
              create_resp = requests.post(create_url, headers=headers, json=create_body)
              print(f"Create: {create_resp.status_code}")

          # 2. Create/check beta group
          print("\n=== Beta groups ===")
          groups_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/betaGroups"
          groups_resp = requests.get(groups_url, headers=headers)
          groups_data = groups_resp.json()
          
          group_id = None
          if "data" in groups_data and len(groups_data["data"]) > 0:
              group_id = groups_data["data"][0]["id"]
              print(f"Found group: {group_id}")
          else:
              print("Creating internal group...")
              create_group_url = "https://api.appstoreconnect.apple.com/v1/betaGroups"
              create_group_body = {"data": {"type": "betaGroups", "attributes": {"name": "Internal Testers", "isInternalGroup": True}, "relationships": {"app": {"data": {"type": "apps", "id": app_id}}}}}
              group_resp = requests.post(create_group_url, headers=headers, json=create_group_body)
              if "data" in group_resp.json():
                  group_id = group_resp.json()["data"]["id"]
                  print(f"Created group: {group_id}")

          # 3. Get builds
          print("\n=== Builds ===")
          builds_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}/builds"
          builds_resp = requests.get(builds_url, headers=headers)
          builds_data = builds_resp.json()

          valid_build = None
          # Sort builds by uploadedDate descending to get the latest first
          builds_list = builds_data.get("data", [])
          # Find build 3 (our Turbo-IO build) specifically
          for build in builds_list:
              v = build["attributes"].get("version", "?")
              s = build["attributes"].get("processingState", "?")
              e = build["attributes"].get("expired", False)
              uploaded = build["attributes"].get("uploadedDate", "")
              print(f"Build {v}: state={s}, expired={e}, uploaded={uploaded}")
              if v == "2" and s == "VALID" and not e:
                  valid_build = build
                  break
          # Fallback to latest valid if build 3 not found
          if not valid_build:
              for build in builds_list:
                  v = build["attributes"].get("version", "?")
                  s = build["attributes"].get("processingState", "?")
                  e = build["attributes"].get("expired", False)
                  if s == "VALID" and not e:
                      valid_build = build
                      break

          if not valid_build:
              print("No valid build found")
              exit(0)

          build_id = valid_build["id"]
          build_ver = valid_build["attributes"]["version"]

          # 4. Add build to group
          if group_id:
              print(f"\nAdding build {build_ver} to group...")
              add_url = f"https://api.appstoreconnect.apple.com/v1/betaGroups/{group_id}/relationships/builds"
              add_body = {"data": [{"type": "builds", "id": build_id}]}
              add_resp = requests.post(add_url, headers=headers, json=add_body)
              print(f"Add to group: {add_resp.status_code}")

          # 5. Set export compliance
          print("\n=== Setting export compliance ===")
          ec_url = f"https://api.appstoreconnect.apple.com/v1/apps/{app_id}"
          ec_body = {
              "data": {
                  "type": "apps",
                  "id": app_id,
                  "attributes": {
                      "usesIdfa": False
                  }
              }
          }
          ec_resp = requests.patch(ec_url, headers=headers, json=ec_body)
          print(f"Export compliance (IDFA): {ec_resp.status_code}")

          # Also set the build's export compliance
          ec_build_url = f"https://api.appstoreconnect.apple.com/v1/builds/{build_id}"
          ec_build_body = {
              "data": {
                  "type": "builds",
                  "id": build_id,
                  "attributes": {
                      "usesNonExemptEncryption": False
                  }
              }
          }
          ec_build_resp = requests.patch(ec_build_url, headers=headers, json=ec_build_body)
          print(f"Build export compliance: {ec_build_resp.status_code}")
          if ec_build_resp.status_code != 200:
              print(json.dumps(ec_build_resp.json(), indent=2)[:500])

          # 6. Submit for beta review
          print(f"\nSubmitting build {build_ver} for beta review...")
          review_url = "https://api.appstoreconnect.apple.com/v1/betaAppReviewSubmissions"
          review_body = {"data": {"type": "betaAppReviewSubmissions", "relationships": {"build": {"data": {"type": "builds", "id": build_id}}}}}
          review_resp = requests.post(review_url, headers=headers, json=review_body)
          print(f"Review submission: {review_resp.status_code}")
          print(json.dumps(review_resp.json(), indent=2)[:500])

          PYEOF
