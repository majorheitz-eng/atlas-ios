name: Trigger EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
      platform:
        description: 'Platform'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build:
    name: EAS Cloud Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Run EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'ios' }}"
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          if [ "$PLATFORM" = "all" ]; then
            npx eas-cli build --platform ios --profile "$PROFILE" --auto-submit --non-interactive --no-wait
            npx eas-cli build --platform android --profile "$PROFILE" --non-interactive --no-wait
          elif [ "$PLATFORM" = "android" ]; then
            npx eas-cli build --platform android --profile "$PROFILE" --non-interactive --no-wait
          else
            npx eas-cli build --platform ios --profile "$PROFILE" --auto-submit --non-interactive --no-wait
          fi
