name: Upload Local IPA to TestFlight

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag with IPA asset'
        required: true
        default: 'build-18'

jobs:
  upload:
    name: Upload IPA to App Store Connect
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use GitHub API to get the asset download URL, then curl with auth
          ASSET_URL=$(curl -s \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.event.inputs.tag }}" \
            | python3 -c "import sys,json; data=json.load(sys.stdin); assets=[a for a in data.get('assets',[]) if a['name'].endswith('.ipa')]; print(assets[0]['url'] if assets else '')")
          if [ -z "$ASSET_URL" ]; then echo "No IPA asset found in release ${{ github.event.inputs.tag }}"; exit 1; fi
          echo "Downloading from: $ASSET_URL"
          curl -sL -o AtlasAI.ipa \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$ASSET_URL"
          ls -lh AtlasAI.ipa
          # Verify it's a valid zip (IPA is a zip)
          file AtlasAI.ipa
          unzip -t AtlasAI.ipa > /dev/null 2>&1 && echo "ZIP OK" || { echo "ZIP CORRUPT"; exit 1; }

      - name: Setup App Store Connect API Key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_4YS72UMN75.p8

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            -f AtlasAI.ipa \
            -t ios \
            --apiKey 4YS72UMN75 \
            --apiIssuer 98cc8215-df4b-4071-993d-2f83eb0e502d

      - name: Result
        run: |
          echo "Upload complete. Check App Store Connect for processing status."
          echo "https://appstoreconnect.apple.com/apps/6818316186/testflight/ios"
